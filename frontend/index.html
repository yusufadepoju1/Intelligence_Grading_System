<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Grading Portal</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Background Elements for Premium Look -->
    <div class="blob-bg blob-1"></div>
    <div class="blob-bg blob-2"></div>

    <div class="app-container">
      <header class="app-header">
        <h1>AI Auto-Grader</h1>
        <p>Intelligent submission analysis powered by Llama</p>
      </header>

      <main class="main-content">
        <!-- Upload Section (Glassmorphism card) -->
        <section class="glass-card upload-section" id="uploadCard">
          <h2>Upload Submission</h2>
          
          <form id="gradingForm" class="grading-form">
            <div class="form-group">
              <label for="studentFile">Student Submission (Required)</label>
              <div class="file-drop-area" id="studentFileArea">
                <span class="file-msg">Drag & Drop or Click to browse (PDF, DOCX, TXT)</span>
                <input type="file" id="studentFile" name="studentFile" accept=".pdf,.doc,.docx,.txt" required>
              </div>
            </div>

            <div class="form-group">
              <label for="markingGuide">Marking Guide (Optional)</label>
              <div class="file-drop-area" id="markingGuideArea">
                <span class="file-msg">Drag & Drop or Click to browse (PDF, DOCX, TXT)</span>
                <input type="file" id="markingGuide" name="markingGuide" accept=".pdf,.doc,.docx,.txt">
              </div>
            </div>

            <div class="form-group">
              <label for="teacherInstructions">Specific Instructions (Optional)</label>
              <textarea id="teacherInstructions" name="teacherInstructions" rows="3" placeholder="e.g., 'Deduct points for poor grammar', 'Focus strictly on the methodology'"></textarea>
            </div>

            <button type="submit" class="prime-btn" id="submitBtn">
              <span class="btn-text">Grade Submission</span>
              <div class="spinner hidden" id="loadingSpinner"></div>
            </button>
          </form>
        </section>

        <!-- Results Section (Initially hidden) -->
        <section class="glass-card results-section hidden" id="resultsCard">
          <div class="results-header">
            <h2>Evaluation Results</h2>
            <button class="secondary-btn" id="resetBtn">Grade Another</button>
          </div>
          
          <div class="student-info-panel">
            <div class="info-badge">
              <span class="lbl">Student Name</span>
              <span class="val" id="resName">-</span>
            </div>
            <div class="info-badge">
              <span class="lbl">ID</span>
              <span class="val" id="resId">-</span>
            </div>
            <div class="info-badge highlight">
              <span class="lbl">Score</span>
              <strong class="val score-val" id="resScore">-</strong>
            </div>
          </div>

          <div class="remarks-box" id="resRemarksBox">
            <h3>Overall Remarks</h3>
            <p id="resRemarks">-</p>
          </div>

          <div class="qa-container" id="qaContainer">
            <!-- Evaluated questions will be injected here by JS -->
          </div>
        </section>

      </main>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
