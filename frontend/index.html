<!doctype html>
<html>
  <head>
    <title>Grading App</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <h1>Grading Project</h1>
    <p>Upload files below to get them graded automatically.</p>

    <div id="uploadCard">
      <form id="gradingForm">
        <p>
          Student file: <br>
          <input type="file" id="studentFile" required>
        </p>
        <p>
          Marking guide: <br>
          <input type="file" id="markingGuide">
        </p>
        <p>
          Extra Rules: <br>
          <textarea id="teacherInstructions" rows="3" cols="40"></textarea>
        </p>
        <button type="submit" id="submitBtn">
          <span class="btn-text">Grade it</span>
          <span id="loadingSpinner" class="hidden"> (working...)</span>
        </button>
      </form>
    </div>

    <hr>

    <div id="resultsCard" class="hidden">
      <h2>Results from AI</h2>
      <p>Student Name: <span id="resName"></span></p>
      <p>Student ID: <span id="resId"></span></p>
      <p>Total Score: <b id="resScore"></b></p>
      
      <div id="resRemarksBox" class="hidden">
        <h3>Remarks</h3>
        <p id="resRemarks"></p>
      </div>

      <div id="qaContainer"></div>

      <button id="resetBtn">Upload Another</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
